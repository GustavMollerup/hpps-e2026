name: Sync from course repo
on:
  schedule:
    - cron: "17 5 * * *"   # daily, about 06:17 Copenhagen time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST "repos/$REPO/merge-upstream" -f branch=main
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
